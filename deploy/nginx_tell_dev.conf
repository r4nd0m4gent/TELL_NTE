# /etc/nginx/snippets/tell_dev.conf
# Dev preview of a feature branch at https://tell.newtexeco.nl/dev/.
# Included in the HTTPS server block of /etc/nginx/sites-available/tell by
# deploy/setup_dev.sh. The pages come from /home/tell/app-dev (a checkout of the
# branch); /home/tell/dev-www/dev is a symlink to its site/ folder, so that
# `root` maps /dev/... onto it.

location = /dev { return 301 /dev/; }

# Dash dashboard of the branch (tell_dev.service)
location /dev/dashboard/ {
    proxy_pass         http://127.0.0.1:8052;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Robots-Tag  "noindex, nofollow";
}

# Static pages of the branch: landing page and funding network
location /dev/ {
    root      /home/tell/dev-www;
    try_files $uri $uri/ =404;
    gzip       on;
    gzip_types application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Robots-Tag  "noindex, nofollow";
}
